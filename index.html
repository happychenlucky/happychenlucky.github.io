<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Hongtu Panel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-auth="logged-in">
    <main class="workspace">
      <section class="blank-area" aria-hidden="true"></section>

      <aside class="right-panel" id="right-panel" aria-label="right panel">
        <button class="resize-handle" id="resize-handle" aria-label="resize panel"></button>

        <header class="panel-header">
          <div class="brand">
            <img class="brand-logo" src="./assets/logo.png" alt="Open Hongtu" />
            <span class="brand-text">Open Hongtu</span>
          </div>

          <div class="header-actions">
            <button id="new-session-btn" class="icon-btn has-tooltip" aria-label="new session" data-tooltip="新会话" data-tip-pos="bottom">
              <img src="./assets/icons/new-chat.svg" alt="" />
            </button>
            <button id="toggle-fullscreen" class="icon-btn has-tooltip" aria-label="fullscreen" data-tooltip="全屏" data-tip-pos="bottom">
              <img class="icon-expand" src="./assets/icons/fullscreen-enter.svg" alt="" />
              <img class="icon-collapse" src="./assets/icons/fullscreen-exit.svg" alt="" />
            </button>
            <button id="close-panel" class="icon-btn" aria-label="close panel">
              <img src="./assets/icons/close-panel.svg" alt="" />
            </button>
          </div>
        </header>

        <div class="panel-body">
          <nav class="side-tabs" aria-label="tabs">
            <button class="tab active" data-tab="chat" aria-current="page" aria-label="chat panel">
              <img
                src="./assets/icons/tab-chat-active.svg"
                data-icon="./assets/icons/tab-chat.svg"
                data-icon-active="./assets/icons/tab-chat-active.svg"
                alt=""
              />
              <span class="tab-label">对话</span>
            </button>
            <button class="tab" data-tab="history" aria-label="history panel">
              <img
                src="./assets/icons/tab-history.svg"
                data-icon="./assets/icons/tab-history.svg"
                data-icon-active="./assets/icons/tab-history-active.svg"
                alt=""
              />
              <span class="tab-label">历史</span>
            </button>

            <div class="side-bottom">
              <button class="side-mini-btn" id="official-site-btn" aria-label="official site">
                <img src="./assets/icons/official-site.svg" alt="" />
              </button>
              <button class="side-mini-btn" id="quick-feedback-btn" aria-label="feedback">
                <img src="./assets/icons/quick-feedback.svg" alt="" />
              </button>
              <button class="side-mini-btn" id="settings-btn" aria-label="settings">
                <img src="./assets/icons/settings.svg" alt="" />
              </button>
              <div class="user-wrap">
                <button class="side-mini-btn user-btn" id="user-btn" aria-label="user profile">
                  <img src="./assets/icons/user-logged-out.svg" data-logged-in-src="./assets/icons/user-logged-out.svg" data-logged-out-src="./assets/icons/user-logged-out.svg" alt="" />
                </button>

                <div class="user-popover" id="user-popover" hidden>
                  <div class="user-info">
                    <img src="./assets/logo.png" alt="" />
                    <div>
                      <strong>Open Hongtu 用户</strong>
                      <span>user@openhongtu.ai</span>
                    </div>
                  </div>
                  <div class="user-menu">
                    <button id="help-center-btn">
                      <img src="./assets/icons/help-center.svg" alt="" />
                      <span>帮助中心</span>
                    </button>
                    <button id="feedback-btn">
                      <img src="./assets/icons/feedback.svg" alt="" />
                      <span>反馈</span>
                    </button>
                    <button id="logout-btn">
                      <img src="./assets/icons/logout.svg" alt="" />
                      <span>退出登录</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </nav>

          <section class="chat-panel" aria-label="chat panel">
            <div class="panel-view is-active" data-view="chat">
              <div class="welcome-home">
                <div class="welcome-hero">
                  <h1>欢迎使用</h1>
                  <p>我是你的浏览器 AI 助手</p>
                </div>

                <div class="welcome-cards" aria-label="feature overview">
                  <article class="welcome-card">
                    <div class="welcome-card-visual visual-browser">
                      <img src="./assets/browser_control.png" alt="" />
                    </div>
                    <div class="welcome-card-body">
                      <h2>浏览器操控</h2>
                      <p>打开页面、点击元素、执行操作</p>
                    </div>
                  </article>
                  <article class="welcome-card">
                    <div class="welcome-card-visual visual-ui">
                      <img src="./assets/generative_ui.png" alt="" />
                    </div>
                    <div class="welcome-card-body">
                      <h2>生成式 UI</h2>
                      <p>清爽模式、优化布局、生成视图</p>
                    </div>
                  </article>
                  <article class="welcome-card">
                    <div class="welcome-card-visual visual-research">
                      <img src="./assets/deep_research.png" alt="" />
                    </div>
                    <div class="welcome-card-body">
                      <h2>深度研究</h2>
                      <p>多步检索、对比分析、整理资料</p>
                    </div>
                  </article>
                </div>
              </div>
              <div class="chat-thread" id="chat-thread" aria-live="polite" hidden></div>

              <div class="composer">
                <div class="composer-controls">
                  <div class="gen-ui" id="gen-ui">
                    <button id="gen-ui-trigger" class="gen-ui-trigger" type="button" aria-expanded="false">
                      <span class="menu-leading-icon gen-ui-icon">✨</span>
                      <span>生成式 UI</span>
                      <img src="./assets/icons/chevron-down.svg" alt="" />
                    </button>
                    <div id="gen-ui-menu" class="gen-ui-menu" hidden>
                      <button type="button" data-gen-mode="fresh" class="is-active">
                        <img src="./assets/icons/mode-fresh.svg" alt="" />
                        <span>清爽模式</span>
                      </button>
                      <button type="button" data-gen-mode="chart">
                        <img src="./assets/icons/mode-chart.svg" alt="" />
                        <span>图表生成</span>
                      </button>
                    </div>
                  </div>

                  <div class="quick-entry" id="quick-entry">
                    <button id="quick-entry-trigger" class="quick-entry-trigger" type="button" aria-expanded="false">
                      <span class="menu-leading-icon quick-entry-icon">⚡</span>
                      <span>快捷</span>
                      <img src="./assets/icons/chevron-down.svg" alt="" />
                    </button>
                    <div id="quick-entry-menu" class="quick-entry-menu" hidden>
                      <div class="quick-entry-group">
                        <div class="quick-entry-title">浏览器操控</div>
                        <button type="button" data-quick-action data-command="/summary">
                          <img src="./assets/icons/action-summary.svg" alt="" />
                          <span>总结该页</span>
                        </button>
                        <button type="button" data-quick-action data-command="/mindmap">
                          <img src="./assets/icons/action-mindmap.svg" alt="" />
                          <span>思维导图</span>
                        </button>
                        <button type="button" data-quick-action data-command="/extract">
                          <img src="./assets/icons/action-extract.svg" alt="" />
                          <span>提取正文</span>
                        </button>
                      </div>
                      <div class="quick-entry-group">
                        <div class="quick-entry-title">深度研究</div>
                        <button type="button" data-quick-action data-command="/analysis">
                          <img src="./assets/icons/action-analysis.svg" alt="" />
                          <span>深度分析</span>
                        </button>
                        <button type="button" data-quick-action data-command="/compare">
                          <img src="./assets/icons/action-compare.svg" alt="" />
                          <span>对比分析</span>
                        </button>
                        <button type="button" data-quick-action data-command="/report">
                          <img src="./assets/icons/action-report.svg" alt="" />
                          <span>研究报告</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                  <input id="attach-input" type="file" hidden />

                    </ul>

                  <div class="model-switch" id="model-switch">

                      </button>
                      <button type="button" data-model-option="Claude Haiku 4.5" data-model-logo="./assets/icons/model-claude.svg">

                      </button>
                      <button type="button" data-model-option="Gemini 3.0 Flash" data-model-logo="./assets/icons/model-gemini-flash.svg">

                      </button>
                      <button type="button" data-model-option="DeepSeek-V4-Flash" data-model-logo="./assets/icons/model-deepseek-flash.svg">

                        <span>DeepSeek-V4-Flash</span>
                      </button>
                      <button type="button" data-model-option="GLM-5" data-model-logo="./assets/icons/model-glm-5.svg">

                      </button>
                      <button type="button" data-model-option="Qwen3-Max" data-model-logo="./assets/icons/model-qwen3-max.svg">

                      <div class="model-switch-group-title">高级</div>
                      <button type="button" data-model-option="GPT-5.4" data-model-logo="./assets/icons/model-gpt5.svg">
                        <img src="./assets/icons/model-gpt5.svg" alt="" />
                        <span>GPT-5.4</span>
                      </button>

                        <span>Gemini 3.1 Pro</span>
                      </button>
                      <button type="button" data-model-option="Claude Sonnet 4.6" data-model-logo="./assets/icons/model-claude.svg">
                        <img src="./assets/icons/model-claude.svg" alt="" />

                      </button>
                      <button type="button" data-model-option="Grok 4" data-model-logo="./assets/icons/model-grok-4.svg">

                      <div class="model-switch-divider"></div>
                      <button id="add-model-btn" type="button" class="add-model-item">

            </div>

            <div class="panel-view history-view" data-view="history">
              <div class="history-top">
                <div class="history-tabs" role="tablist" aria-label="history filter">
                  <button class="history-tab is-active" data-history-tab="all" role="tab" aria-selected="true">全部</button>

              </div>

                  <img src="./assets/icons/search.svg" alt="" />

                </div>
                <div class="history-list" data-history-list="all"></div>
              </div>

              <div class="history-list-wrap" data-history-view="favorites">
                <div class="history-search">
                  <img src="./assets/icons/search.svg" alt="" />
                  <input data-history-search="favorites" type="text" placeholder="搜索" />
                </div>
                <div class="history-list" data-history-list="favorites"></div>
              </div>
            </div>
          </section>
        </div>

        <div class="confirm-layer" id="delete-confirm-layer" hidden>
          <div class="confirm-mask" data-confirm-close></div>
          <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
            <h3 id="delete-confirm-title"></h3>
            <p id="delete-confirm-desc"></p>
            <label class="confirm-check" id="delete-confirm-favorites-wrap" hidden>

                <div class="confirm-actions">
                  <button id="delete-confirm-cancel" type="button">取消</button>
                  <button id="delete-confirm-submit" type="button">删除</button>
                </div>
              </div>
            </div>

            <div class="confirm-layer" id="edit-title-layer" hidden>
              <div class="confirm-mask" data-edit-close></div>
              <div class="confirm-dialog edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-title-title">

                  <button id="edit-title-cancel" type="button">取消</button>
                  <button id="edit-title-submit" type="button">保存</button>
                </div>
              </div>
            </div>
          </aside>

        function syncUserAvatar() {
          if (!userBtnAvatar) return;
          const loggedInSrc = userBtnAvatar.dataset.loggedInSrc || userBtnAvatar.src;
          const loggedOutSrc = userBtnAvatar.dataset.loggedOutSrc || loggedInSrc;
          userBtnAvatar.src = isLoggedIn() ? loggedInSrc : loggedOutSrc;
        }

        function navigateKeepingPanel(pageKey) {
          const hash = "#/" + pageKey;
          if (window.location.hash !== hash) window.location.hash = hash;
          document.body.dataset.page = pageKey;
          closeUserPopover();
          closeModelMenu();
          closeGenUiMenu();
          closeQuickEntryMenu();
          closeHistoryMenus();
        }

        function closeModelMenu() {
          modelSwitchMenu.hidden = true;
          modelSwitchTrigger.setAttribute("aria-expanded", "false");
          modelSwitch.classList.remove("open");
        }

        function openModelMenu() {
          closeGenUiMenu();
          closeQuickEntryMenu();
          modelSwitchMenu.hidden = false;
          modelSwitchTrigger.setAttribute("aria-expanded", "true");
          modelSwitch.classList.add("open");
        }

        function closeGenUiMenu() {
          genUiMenu.hidden = true;
          genUiTrigger.setAttribute("aria-expanded", "false");
          genUi.classList.remove("open");
        }

        function openGenUiMenu() {
          closeModelMenu();
          closeQuickEntryMenu();
          genUiMenu.hidden = false;
          genUiTrigger.setAttribute("aria-expanded", "true");
          genUi.classList.add("open");
        }

        function closeQuickEntryMenu() {
          quickEntryMenu.hidden = true;
          quickEntryTrigger.setAttribute("aria-expanded", "false");
          quickEntry.classList.remove("open");
        }

        function openQuickEntryMenu() {
          closeModelMenu();
          closeGenUiMenu();
          quickEntryMenu.hidden = false;
          quickEntryTrigger.setAttribute("aria-expanded", "true");
          quickEntry.classList.add("open");
        }

        function syncGenUiToggle() {
          const modeItems = Array.from(genUiMenu.querySelectorAll("[data-gen-mode]"));
          modeItems.forEach((btn) => {
            btn.classList.toggle("is-active", btn.dataset.genMode === genUiMode);
          });
        }

        function getModelLabel(modelName) {
          return modelName;
        }

        function setCurrentModel(modelName, logoPath) {
          currentModel = modelName;
          currentModelLogo = logoPath || currentModelLogo;
          modelSwitchCurrent.textContent = getModelLabel(modelName);
          modelSwitchTrigger.setAttribute("title", modelName);
          modelSwitchCurrentLogo.src = currentModelLogo;
          const options = Array.from(modelSwitchMenu.querySelectorAll("[data-model-option]"));
          options.forEach((btn) => {
            btn.classList.toggle("is-active", btn.dataset.modelOption === modelName);
          });
        }

        function setWidth(width) {
          const value = Math.max(MIN, Math.min(MAX, width));
          panel.style.width = value + "px";
        }

        function normalizeSlashCommand(value) {
          if (!value || value.charAt(0) !== "/") return value;
          const match = value.match(/^\/([^\s]+)([\s\S]*)$/);
          if (!match) return value;
          const token = match[1];
          const tail = match[2] || "";
          const map = {
            "总结该页": "summary",
            "思维导图": "mindmap",
            "提取正文": "extract",
            "深度分析": "analysis",
            "对比分析": "compare",
            "研究报告": "report",
            "浏览器操控": "browser",
            "深度研究": "research",
            "清爽模式": "fresh",
            "图表生成": "chart"
          };
          const normalized = map[token];
          if (!normalized) return value;
          return "/" + normalized + tail;
        }

        function updateSendState() {
          const hasValue = !!chatInput.value.trim();
          sendBtn.disabled = !hasValue;
          const trimmed = chatInput.value.trim();
          chatInput.classList.toggle("is-command", trimmed.startsWith("/"));
        }

        function startChatIfNeeded() {
          if (chatStarted) return;
          chatStarted = true;
          syncChatGuideVisibility();
        }

        function syncChatGuideVisibility() {
          const hasMessages = chatThread.children.length > 0 || chatStarted;
          welcomeHome.hidden = hasMessages;
          chatThread.hidden = !hasMessages;
        }

        function appendChatBubble(role, text) {
          const item = document.createElement("article");
          item.className = "chat-bubble-row " + (role === "user" ? "is-user" : "is-ai");

          const bubble = document.createElement("div");
          bubble.className = "chat-bubble";
          bubble.textContent = text;

          item.appendChild(bubble);
          chatThread.appendChild(item);
          syncChatGuideVisibility();
          chatThread.scrollTop = chatThread.scrollHeight;
        }

        function appendTypingIndicator() {
          if (document.getElementById("typing-indicator")) return;
          const item = document.createElement("article");
          item.className = "chat-bubble-row is-ai";
          item.id = "typing-indicator";
          const bubble = document.createElement("div");
          bubble.className = "chat-bubble typing-bubble";
          const dots = document.createElement("div");
          dots.className = "typing-dots";
          for (let i = 0; i < 3; i++) {
            const dot = document.createElement("span");
            dots.appendChild(dot);
          }
          bubble.appendChild(dots);
          item.appendChild(bubble);
          chatThread.appendChild(item);
          chatThread.scrollTop = chatThread.scrollHeight;
        }

        function removeTypingIndicator() {
          const indicator = document.getElementById("typing-indicator");
          if (indicator) indicator.remove();
        }

        function appendMockAnswer() {
          removeTypingIndicator();
          appendChatBubble(
            "ai",
            "这是一个模拟回复：我已经收到你的问题，会基于当前网页内容帮你梳理重点、分析信息，并生成可执行的下一步建议。"
          );
        }

        function resetChatHome() {
          chatStarted = false;
          mockReplyTimers.forEach((timer) => clearTimeout(timer));
          mockReplyTimers = [];
          removeTypingIndicator();
          chatThread.innerHTML = "";
          syncChatGuideVisibility();
        }

        function autoResizeInput() {
          chatInput.style.height = "auto";
          const newHeight = Math.min(200, Math.max(48, chatInput.scrollHeight));
          chatInput.style.height = newHeight + "px";
        }

        function submitChatInput() {
          const value = chatInput.value.trim();
          if (!value) return;
          startChatIfNeeded();
          appendChatBubble("user", value);
          chatInput.value = "";
          chatInput.style.height = "auto";
          updateSendState();
          chatInput.focus();
          appendTypingIndicator();
          const timer = setTimeout(function () {
            appendMockAnswer();
            mockReplyTimers = mockReplyTimers.filter((item) => item !== timer);
          }, 2000);
          mockReplyTimers.push(timer);
        }

        function syncState() {
          document.body.classList.toggle("panel-fullscreen", fullscreen);
          panel.classList.toggle("is-fullscreen", fullscreen);
          toggle.classList.toggle("is-fullscreen", fullscreen);
          toggle.setAttribute("aria-label", fullscreen ? "exit fullscreen" : "fullscreen");
          toggle.setAttribute("data-tooltip", fullscreen ? "退出全屏" : "全屏");
        }

        function switchPanel(target) {
          tabs.forEach((tab) => {
            const active = tab.dataset.tab === target;
            tab.classList.toggle("active", active);
            if (active) tab.setAttribute("aria-current", "page");
            else tab.removeAttribute("aria-current");
            const icon = tab.querySelector("img");
            if (icon && icon.dataset.icon && icon.dataset.iconActive) {
              icon.src = active ? icon.dataset.iconActive : icon.dataset.icon;
            }
          });
          views.forEach((view) => {
            view.classList.toggle("is-active", view.dataset.view === target);
          });
        }

        function switchHistoryTab(target) {
          activeHistoryTab = target;
          historyTabs.forEach((tab) => {
            const active = tab.dataset.historyTab === target;
            tab.classList.toggle("is-active", active);
            tab.setAttribute("aria-selected", active ? "true" : "false");
          });
          historyViews.forEach((view) => {
            view.classList.toggle("is-active", view.dataset.historyView === target);
          });
          ensureSelectedConversation();
          renderHistoryLists();
        }

        function escapeHtml(value) {
          return value.replace(/[&<>"']/g, function (char) {
            if (char === "&") return "&amp;";
            if (char === "<") return "&lt;";
            if (char === ">") return "&gt;";
            if (char === '"') return "&quot;";
            return "&#39;";
          });
        }

        function getDisplayList(targetTab) {
          const base = targetTab === "favorites" ? conversations.filter((item) => item.favorited) : conversations;
          const keyword = (targetTab === "favorites" ? searchFavorites : searchAll).trim().toLowerCase();
          if (!keyword) return base;
          return base.filter((item) => {
            return item.title.toLowerCase().includes(keyword) || item.preview.toLowerCase().includes(keyword);
          });
        }

        function ensureSelectedConversation() {
          const visible = getDisplayList(activeHistoryTab);
          if (!visible.some((item) => item.id === selectedConversationId)) {
            selectedConversationId = visible.length ? visible[0].id : null;
          }
        }

        function buildHistoryItem(item, selected) {
          const starIcon = item.favorited ? "./assets/icons/star-fill.svg" : "./assets/icons/star-outline.svg";
          const title = escapeHtml(item.title);
          const preview = escapeHtml(item.preview);
          return `
            <article class="history-chat-item ${selected ? "is-selected" : ""}" data-conversation-id="${item.id}">
              <div class="history-chat-main">
                <strong>${title}</strong>
                <span>${preview}</span>
              </div>
              <div class="history-chat-actions">
                <button class="history-more" data-menu-toggle data-conversation-id="${item.id}" aria-expanded="false" aria-label="more actions">
                  <img src="./assets/icons/more-horizontal.svg" alt="" />
                </button>
                <button class="history-fav ${item.favorited ? "is-favorited" : ""}" data-favorite-toggle data-conversation-id="${item.id}" aria-label="favorite">
                  <img src="${starIcon}" alt="" />
                </button>
                <div class="history-menu" data-history-menu hidden>
                  <button type="button" data-edit-title="${item.id}">
                    <img src="./assets/icons/edit.svg" alt="" />
                    <span>编辑标题</span>
                  </button>
                  <button type="button" data-delete-single="${item.id}">
                    <img src="./assets/icons/delete.svg" alt="" />
                    <span>删除</span>
                  </button>
                </div>
              </div>
            </article>
          `;
        }

        function renderHistoryList(container, list) {
          if (!list.length) {
            container.innerHTML = '<div class="history-empty">暂无会话记录</div>';
            return;
          }
          container.innerHTML = list
            .map((item) => buildHistoryItem(item, item.id === selectedConversationId))
            .join("");
        }

        function renderHistoryLists() {
          renderHistoryList(allHistoryList, getDisplayList("all"));
          renderHistoryList(favoritesHistoryList, getDisplayList("favorites"));
          closeHistoryMenus();
        }

        function closeHistoryMenus() {
          const toggles = Array.from(document.querySelectorAll("[data-menu-toggle]"));
          const openedItems = Array.from(document.querySelectorAll(".history-chat-item.menu-open"));
          openedItems.forEach((item) => item.classList.remove("menu-open"));
          toggles.forEach((btn) => {
            btn.setAttribute("aria-expanded", "false");
            const menu = btn.parentElement.querySelector("[data-history-menu]");
            if (menu) menu.hidden = true;
          });
        }

        function openDeleteConfirm(payload) {
          pendingDeleteAction = payload;
          if (payload.type === "all") {
            deleteConfirmTitle.textContent = "删除全部会话";
            deleteConfirmDesc.textContent = "确认删除全部历史会话？删除后将无法恢复。";
            deleteConfirmFavoritesWrap.hidden = false;
            deleteConfirmFavorites.checked = false;
            deleteConfirmSubmit.textContent = "全部删除";
          } else {
            deleteConfirmTitle.textContent = "删除会话";
            deleteConfirmDesc.textContent = "确认删除这条会话？删除后将无法恢复。";
            deleteConfirmFavoritesWrap.hidden = true;
            deleteConfirmFavorites.checked = false;
            deleteConfirmSubmit.textContent = "删除";
          }
          deleteConfirmLayer.hidden = false;
        }

        function closeDeleteConfirm() {
          pendingDeleteAction = null;
          deleteConfirmFavorites.checked = false;
          deleteConfirmLayer.hidden = true;
        }

        function runDeleteAction() {
          if (!pendingDeleteAction) return;
          if (pendingDeleteAction.type === "single") {
            conversations = conversations.filter((item) => item.id !== pendingDeleteAction.id);
          } else {
            const withFavorites = deleteConfirmFavorites.checked;
            conversations = withFavorites ? [] : conversations.filter((item) => item.favorited);
          }
          ensureSelectedConversation();
          renderHistoryLists();
          closeDeleteConfirm();
        }

        function openEditTitleModal(id) {
          const target = conversations.find((item) => item.id === id);
          if (!target) return;
          pendingEditConversationId = id;
          editTitleInput.value = target.title;
          editTitleLayer.hidden = false;
          setTimeout(function () {
            editTitleInput.focus();
            editTitleInput.select();
          }, 0);
        }

        function closeEditTitleModal() {
          pendingEditConversationId = null;
          editTitleLayer.hidden = true;
          editTitleInput.value = "";
        }

        function submitEditTitle() {
          if (!pendingEditConversationId) return;
          const value = editTitleInput.value.trim();
          if (!value) return;
          const target = conversations.find((item) => item.id === pendingEditConversationId);
          if (!target) {
            closeEditTitleModal();
            return;
          }
          target.title = value;
          renderHistoryLists();
          closeEditTitleModal();
        }

        tabs.forEach((tab) => {
          tab.addEventListener("click", function () {
            switchPanel(tab.dataset.tab);
          });
        });

        historyTabs.forEach((tab) => {
          tab.addEventListener("click", function () {
            switchHistoryTab(tab.dataset.historyTab);
          });
        });

        document.addEventListener("click", function (e) {
          const deleteSingleBtn = e.target.closest("[data-delete-single]");
          const editTitleBtn = e.target.closest("[data-edit-title]");
          const btn = e.target.closest("[data-menu-toggle]");
          const clickedUserButton = e.target.closest("#user-btn");
          const clickedPopover = e.target.closest("#user-popover");
          if (!clickedUserButton && !clickedPopover) {
            closeUserPopover();
          }

          if (deleteSingleBtn) {
            e.stopPropagation();
            const id = deleteSingleBtn.dataset.deleteSingle;
            closeHistoryMenus();
            openDeleteConfirm({ type: "single", id });
            return;
          }

          if (editTitleBtn) {
            e.stopPropagation();
            const id = editTitleBtn.dataset.editTitle;
            closeHistoryMenus();
            openEditTitleModal(id);
            return;
          }

          const favBtn = e.target.closest("[data-favorite-toggle]");
          if (favBtn) {
            e.stopPropagation();
            const id = favBtn.dataset.conversationId;
            const hit = conversations.find((item) => item.id === id);
            if (!hit) return;
            hit.favorited = !hit.favorited;
            ensureSelectedConversation();
            renderHistoryLists();
            return;
          }

          const item = e.target.closest(".history-chat-item");
          if (item && !e.target.closest(".history-chat-actions")) {
            selectedConversationId = item.dataset.conversationId;
            renderHistoryLists();
            return;
          }

          if (!btn) {
            closeHistoryMenus();
            return;
          }
          e.stopPropagation();
          const itemNode = btn.closest(".history-chat-item");
          const menu = btn.parentElement.querySelector("[data-history-menu]");
          const willOpen = menu && menu.hidden;
          closeHistoryMenus();
          if (menu && willOpen) {
            menu.hidden = false;
            btn.setAttribute("aria-expanded", "true");
            if (itemNode) itemNode.classList.add("menu-open");
          }
        });

        handle.addEventListener("mousedown", function (e) {
          e.preventDefault();
          if (fullscreen) {
            fullscreen = false;
            setWidth(DEFAULT);
            syncState();
          }
          dragging = true;
          document.body.classList.add("is-resizing");
        });

        window.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          setWidth(window.innerWidth - e.clientX);
        });

        window.addEventListener("mouseup", function () {
          if (!dragging) return;
          dragging = false;
          document.body.classList.remove("is-resizing");
        });

        toggle.addEventListener("click", function () {
          fullscreen = !fullscreen;
          if (!fullscreen) setWidth(DEFAULT);
          syncState();
        });

        newSessionBtn.addEventListener("click", function () {
          switchPanel("chat");
          resetChatHome();
          closeHistoryMenus();
          closeModelMenu();
          closeGenUiMenu();
          closeQuickEntryMenu();
          closeUserPopover();
        });

        closeBtn.addEventListener("click", function () {
          panel.style.display = "none";
        });

        userBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!isLoggedIn()) {
            navigateKeepingPanel("login");
            return;
          }
          userPopover.hidden = !userPopover.hidden;
        });

        helpCenterBtn.addEventListener("click", function () {
          navigateKeepingPanel("help-center");
        });

        feedbackBtn.addEventListener("click", function () {
          navigateKeepingPanel("feedback");
        });

        officialSiteBtn.addEventListener("click", function () {
          navigateKeepingPanel("official-site");
        });

        quickFeedbackBtn.addEventListener("click", function () {
          navigateKeepingPanel("feedback");
        });

        logoutBtn.addEventListener("click", function () {
          document.body.dataset.auth = "logged-out";
          closeUserPopover();
          syncUserAvatar();
        });

        modelSwitchTrigger.addEventListener("click", function (e) {
          e.stopPropagation();
          if (modelSwitchMenu.hidden) openModelMenu();
          else closeModelMenu();
        });

        modelSwitchMenu.addEventListener("click", function (e) {
          const option = e.target.closest("[data-model-option]");
          if (!option) return;
          e.stopPropagation();
          setCurrentModel(option.dataset.modelOption, option.dataset.modelLogo);
          closeModelMenu();
        });

        genUiTrigger.addEventListener("click", function (e) {
          e.stopPropagation();
          if (genUiMenu.hidden) openGenUiMenu();
          else closeGenUiMenu();
        });

        genUiMenu.addEventListener("click", function (e) {
          const item = e.target.closest("[data-gen-mode]");
          if (!item) return;
          e.stopPropagation();
          genUiMode = item.dataset.genMode;
          syncGenUiToggle();
          closeGenUiMenu();
        });

        quickEntryTrigger.addEventListener("click", function (e) {
          e.stopPropagation();
          if (quickEntryMenu.hidden) openQuickEntryMenu();
          else closeQuickEntryMenu();
        });

        quickEntryMenu.addEventListener("click", function (e) {
          const action = e.target.closest("[data-quick-action]");
          if (!action) return;
          e.stopPropagation();
          const command = action.dataset.command || "";
          if (chatInput && command) {
            chatInput.value = command;
            updateSendState();
            chatInput.focus();
          }
          closeQuickEntryMenu();
        });

        chatInput.addEventListener("input", function () {
          const original = chatInput.value;
          const normalized = normalizeSlashCommand(original);
          if (normalized !== original) {
            const cursor = chatInput.selectionStart;
            const delta = normalized.length - original.length;
            chatInput.value = normalized;
            const nextCursor = Math.max(0, cursor + delta);
            chatInput.setSelectionRange(nextCursor, nextCursor);
          }
          updateSendState();
          autoResizeInput();
        });

        chatInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            submitChatInput();
          }
        });

        attachBtn.addEventListener("click", function () {
          attachInput.click();
        });

        attachInput.addEventListener("change", function () {
          attachInput.value = "";
        });

        sendBtn.addEventListener("click", submitChatInput);

        addModelBtn.addEventListener("click", function () {
          navigateKeepingPanel("settings");
        });

        historyDeleteAllBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          closeHistoryMenus();
          openDeleteConfirm({ type: "all" });
        });

        allSearchInput.addEventListener("input", function () {
          searchAll = allSearchInput.value;
          ensureSelectedConversation();
          renderHistoryLists();
        });

        favoritesSearchInput.addEventListener("input", function () {
          searchFavorites = favoritesSearchInput.value;
          ensureSelectedConversation();
          renderHistoryLists();
        });

        deleteConfirmCancel.addEventListener("click", closeDeleteConfirm);
        deleteConfirmSubmit.addEventListener("click", runDeleteAction);

        deleteConfirmLayer.addEventListener("click", function (e) {
          if (e.target.closest("[data-confirm-close]")) {
            closeDeleteConfirm();
          }
        });

        editTitleLayer.addEventListener("click", function (e) {
          if (e.target.closest("[data-edit-close]")) {
            closeEditTitleModal();
          }
        });

        editTitleCancel.addEventListener("click", closeEditTitleModal);
        editTitleSubmit.addEventListener("click", submitEditTitle);
        editTitleInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            submitEditTitle();
          }
        });

        document.addEventListener("click", function (e) {
          if (!e.target.closest("#model-switch")) closeModelMenu();
          if (!e.target.closest("#gen-ui")) closeGenUiMenu();
          if (!e.target.closest("#quick-entry")) closeQuickEntryMenu();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          closeHistoryMenus();
          closeUserPopover();
          closeModelMenu();
          closeGenUiMenu();
          closeQuickEntryMenu();
          if (!editTitleLayer.hidden) closeEditTitleModal();
          if (!deleteConfirmLayer.hidden) closeDeleteConfirm();
        });

        closeModelMenu();
        closeGenUiMenu();
        closeQuickEntryMenu();
        syncUserAvatar();
        setCurrentModel(currentModel, currentModelLogo);
        syncGenUiToggle();
        updateSendState();
        syncChatGuideVisibility();
        renderHistoryLists();
        autoResizeInput();
        switchPanel("chat");
        switchHistoryTab("all");
        syncState();
      })();
    </script>
  </body>
</html>
